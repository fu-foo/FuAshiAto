[package]
name = "fuashiato"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
resolver = "3"
description = "Records the footprints of your own work on Windows"
license = "Apache-2.0"
repository = "https://github.com/fu-foo/FuAshiAto"

[dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_WindowsProgramming",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[build-dependencies]
embed-resource = "=3.0.11"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
